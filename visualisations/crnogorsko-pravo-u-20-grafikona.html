part('p1', 'I. Službeni list i važeći propisi', 'I. The Službeni list and the acts in force',
  'Pravni informacioni sistem Službenog lista (PIS) vodi svaki akt kao važeći ili nevažeći; ovaj repozitorijum drži važeće, svaki onakav kakav je objavljen. Grafikoni zato pokazuju šta je danas na snazi, po godini objavljivanja, a ne sve što je ikad objavljeno: ukinuti akti ovdje nijesu.',
  'The Službeni list\'s legal information system (PIS) marks every act as in force or not; this repository holds those in force, each as published. So the charts show what is in force today, by year of publication, not everything ever published: repealed acts are not here.');

const KEYS6 = ['law', 'decree', 'rule', 'dec', 'ruling', 'other'];

chart('c01', el => {
  const c = D.c01, rows = c.rows, colors = KCOL();
  const tot = r => sum(KEYS6, k => r[k] || 0), all = sum(rows, tot), post = sum(rows.filter(r => r.y >= 2007), tot), pre = sum(rows.filter(r => r.y <= 2006), tot);
  const last = rows[rows.length - 1], mx = rows.filter(r => r.y < YEAR_LAST).reduce((a, b) => tot(a) > tot(b) ? a : b);
  return {
    title: L(`Šta je danas na snazi: ${pct(post, all)} važećih akata objavljeno je 2007. ili kasnije`, `What is in force today: ${pct(post, all)} of the acts in force were published in 2007 or later`),
    dek: L(`Svaki stubac je jedna godina objavljivanja u Službenom listu: koliko akata iz te godine PIS danas vodi kao važeće, po vrsti akta. Iz godina 1992–2006 važi još ${fnw(pre, 'act')}. Najviše važećih akata objavljeno je ${mx.y}. (${fmt(tot(mx))}); ${last.y}. je do ${dateTxt(PF.last_pub)} donijela već ${fmt(tot(last))}, od toga ${fnw(last.law, 'law')} i ${fnw(last.rule, 'rule')}.`,
      `Each column is one year of publication in the Službeni list: how many acts of that year the PIS marks in force today, by kind of act. From 1992–2006, ${fmt(pre)} acts are still in force. The most acts in force were published in ${mx.y} (${fmt(tot(mx))}); by ${dateTxt(PF.last_pub)}, ${last.y} had already brought ${fmt(tot(last))}, including ${fmt(last.law)} laws and ${fmt(last.rule)} rulebooks.`),
    draw(el) {
      legend(el, KEYS6.map((k, i) => ({ c: colors[i], l: L(...KIND[k]) })));
      const s = stackedColumns(el, rows, KEYS6, colors, KEYS6.map(k => L(...KIND[k])), { partial: r => r.y === YEAR_LAST, pad: 0.18, mt: 30, every: narrow(W(el)) ? 5 : 2,
        xf: y => narrow(W(el)) ? `’${String(y).slice(2)}` : y });
      if (c.independence) {
        const xx = s.x(2006) + s.x.bandwidth() * (fy(c.independence) - 2006);
        s.g.append('line').attr('x1', xx).attr('x2', xx).attr('y1', -22).attr('y2', s.ih).attr('stroke', css('--text-2')).attr('stroke-dasharray', '3 3');
        const full = L(`proglašenje nezavisnosti, ${dateShort(c.independence)}`, `independence proclaimed, ${dateShort(c.independence)}`);
        halo(s.g, xx + 5, -12, xx + 5 + textW(el, [full]) <= s.iw ? full : L(`nezavisnost, ${dateShort(c.independence)}`, `independence, ${dateShort(c.independence)}`), 'start', 'lbl strong');
      }
      note(el, ['data/acts.json', 'data/laws.csv', 'odluka/2006/06/302424'], fnw(all, 'act'),
        L(`godina je godina objavljivanja iz putanje akta (<vrsta>/<godina>/); Ustav nema godinu i nije uključen. „Ostali akti“ su naredbe, uputstva, pravila, programi, planovi, statuti, poslovnici, međunarodni ugovori i akti bez posebne vrste. Datum nezavisnosti je dan stupanja na snagu Odluke o proglašenju nezavisnosti Republike Crne Gore. ${last.y}. je nepotpuna (do ${dateTxt(PF.last_pub)}).`,
          `the year is the year of publication in the act's path (<kind>/<year>/); the Constitution has no year and is left out. "Other acts" are orders, instructions, rules, programmes, plans, statutes, rules of procedure, international agreements and acts of no particular kind. The independence date is the day the Decision proclaiming the independence of the Republic of Montenegro took effect. ${last.y} is partial (to ${dateTxt(PF.last_pub)}).`));
      table(el, [t('year'), ...KEYS6.map(k => L(...KIND[k])), t('total')], rows.map(r => [String(r.y), ...KEYS6.map(k => r[k] || 0), tot(r)]));
    }

chart('c02', el => {
  const c = D.c02, cols = S8(), T = k => c.tot[k] || 0, all = sum(Object.values(c.tot));
  const K = ['parliament', 'government', 'ministry', 'other', 'municipal', 'rest'];
  const colors = [cols[6], cols[0], cols[2], cols[3], cols[1], css('--muted-mark')];
  const val = (o, k) => k === 'other' ? (o.other || 0) + (o.cbank || 0) : k === 'rest' ? (o.president || 0) + (o.None || 0) : (o[k] || 0);
  const tot = { }; K.forEach(k => tot[k] = val(c.tot, k));
  const kinds = k => { const o = {}; const src = k === 'other' ? ['other', 'cbank'] : k === 'rest' ? ['president', 'None'] : [k];
    src.forEach(s => Object.entries(c.kinds[s] || {}).forEach(([kk, v]) => o[kk] = (o[kk] || 0) + v)); return o; };
  const munPre = sum(c.periods.filter(p => p.b <= 2006), p => p.municipal || 0);
  const lawsN = (c.kinds.parliament || {}).law || 0;
  return {
    title: L(`Ko donosi propise: ${pct(tot.municipal, all)} važećih akata donijele su opštine`, `Who makes the acts in force: municipalities made ${pct(tot.municipal, all)} of them`),
    dek: L(`Preambula akta kaže ko ga je donio („… Skupština opštine Tivat, na sjednici održanoj …, donijela je“). Opštine su donijele ${fmt(tot.municipal)} važećih akata, ministarstva i organi uprave ${fmt(tot.ministry)}, Vlada ${fmt(tot.government)}, a Skupština Crne Gore ${fmt(tot.parliament)}, od toga ${fnw(lawsN, 'law')}. Opštinskih akata iz godina prije 2007. u registru gotovo da nema (${fmt(munPre)}). Ispod su udjeli po periodima objavljivanja.`,
      `An act's preamble says who made it ("… the Assembly of the Municipality of Tivat, at its session held …, adopted"). Municipalities made ${fmt(tot.municipal)} of the acts in force, ministries and administrative bodies ${fmt(tot.ministry)}, the Government ${fmt(tot.government)} and the Skupština ${fmt(tot.parliament)}, ${fmt(lawsN)} of them laws. Municipal acts from before 2007 are almost absent from the register (${fmt(munPre)}). Below, the shares by period of publication.`),
    draw(el) {
      const cards = el.append('div').attr('class', 'ptiles');
      ['municipal', 'ministry', 'government', 'parliament', 'other'].forEach(k => {
        const d = cards.append('div').attr('class', 'ptile'), ko = kinds(k);
        d.append('div').attr('class', 'pn').text(L(...ISSUER[k]));
        d.append('div').attr('class', 'pv').html(`<b>${fmt(tot[k])}</b> ${esc(nw(tot[k], 'act'))}`);
        const top = Object.entries(ko).sort((a, b) => b[1] - a[1])[0];
        d.append('div').attr('class', 'ps').text(L(`${pct(tot[k], all)} svih · najviše: ${L(...KIND[top[0]]).toLowerCase()}`, `${pct(tot[k], all)} of all · mostly ${L(...KIND[top[0]]).toLowerCase()}`));
        const bar = d.append('div').attr('class', 'pbar');
        bar.append('i').style('flex', tot[k]).style('background', colors[K.indexOf(k)]); bar.append('i').style('flex', all - tot[k]).style('background', css('--line'));
      });
      legend(el, K.map((k, i) => ({ c: colors[i], l: L(...ISSUER[k]) })));
      const rows = c.periods.map(p => { const o = { p: p.p, a: p.a, b: p.b }; K.forEach(k => o[k] = val(p, k)); return o; });
      bands(el, rows, K, colors, K.map(k => L(...ISSUER[k])), { label: r => r.p, right: r => fmt(sum(K, k => r[k])), partial: r => r.b === YEAR_LAST, rowH: 34 });
      note(el, ['<vrsta>/<godina>/<PIS id>/0-uvod.md', 'tekst.md'], fnw(all, 'act'),
        L(`donosilac se čita iz preambule (ili s početka teksta) pravilima u src/prep.py: riječi između pravnog osnova i „na sjednici“ ili glagola („donijela je“, „donosi“); zakone uvijek donosi Skupština. Centralna banka (${fmt(T('cbank'))}) je s agencijama i fondovima; predsjednik Crne Gore (${fmt(T('president'))}) i akti bez prepoznatog donosioca (${fmt(T('None'))}) su posljednja grupa. Traka u kartici je udio u svim važećim aktima. Period ${c.periods[c.periods.length - 1].p} je nepotpun.`,
          `the maker is read from the preamble (or the start of the text) by the rules in src/prep.py: the words between the legal basis and "na sjednici" (at its session) or the verb ("donijela je", "donosi"); laws are always made by the Skupština. The Central Bank (${fmt(T('cbank'))}) is counted with agencies and funds; the President of Montenegro (${fmt(T('president'))}) and acts with no recognised maker (${fmt(T('None'))}) form the last group. The bar in each card is its share of all acts in force. The period ${c.periods[c.periods.length - 1].p} is partial.`));
      table(el, [L('Period', 'Period'), ...K.map(k => L(...ISSUER[k])), t('total')], rows.map(r => [r.p, ...K.map(k => r[k]), sum(K, k => r[k])]));

chart('c03', el => {
  const rows = D.c03.rows, st = r => r.sc + r.sl, mu = r => r.mc + r.ml, cols = S8();
  const rec = rows.filter(r => r.y >= 2018), sC = sum(rec, r => r.sc), sN = sum(rec, st), mC = sum(rec, r => r.mc), mN = sum(rec, mu);
  const e = rows.filter(r => r.y <= 1997), eC = sum(e, r => r.sc), eN = sum(e, st);
  const l = rows.filter(r => r.y >= 1998 && r.y <= 2005), lC = sum(l, r => r.sc), lN = sum(l, st);
  const r10 = rows.find(r => r.y === 2010) || rows[0];
  return {
    title: L(`Ćirilica i latinica: od 2018. državni akti gotovo samo latinicom, opštinski ${pct(mC, mN)} ćirilicom`, `Cyrillic and Latin: since 2018 state acts almost only in Latin, municipal acts ${pct(mC, mN)} in Cyrillic`),
    dek: L(`Ustav (član 13): „Ćirilično i latinično pismo su ravnopravni.“ Svaki stubac je jedna godina objavljivanja, a tamni dio udio akata čiji je tekst ćirilicom. ${eC === eN ? `Svi važeći državni akti iz 1992–1997 (${fmt(eN)}) pisani su ćirilicom` : `Od ${fmt(eN)} važećih državnih akata iz 1992–1997 ćirilicom je ${fmt(eC)}`}, a od ${fmt(lN)} iz 1998–2005 ćirilicom je ${fmt(lC)}; 2010. ćirilicom je opet ${pct(r10.sc, st(r10))}. Od 2018. ćirilicom je ${pct(sC, sN)} državnih i ${pct(mC, mN)} opštinskih akata.`,
      `The Constitution (Art. 13): "The Cyrillic and Latin scripts shall be equal." Each column is one year of publication; the dark part is the share of acts whose text is in Cyrillic. ${eC === eN ? `All state acts in force from 1992–1997 (${fmt(eN)}) are in Cyrillic` : `Of ${fmt(eN)} state acts in force from 1992–1997, ${fmt(eC)} are in Cyrillic`}; of the ${fmt(lN)} from 1998–2005, ${fmt(lC)} ${lC === 1 ? 'is' : 'are'}; in 2010, ${pct(r10.sc, st(r10))} were in Cyrillic again. Since 2018, ${pct(sC, sN)} of state acts and ${pct(mC, mN)} of municipal acts are in Cyrillic.`),
    draw(el) {
      const cc = cols[6], light = css('--surface-2');
      legend(el, [{ c: cc, l: L('ćirilica', 'Cyrillic') }, { c: light, l: L('latinica', 'Latin') }]);
      const panel = (name, cyr, n) => {
        h4(el, name, 10);
        const w = W(el), nwd = narrow(w), h = 150, m = { t: 26, r: 6, b: 22, l: 34 };
        const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b;
        const x = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(0.18), y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
        [0, .5, 1].forEach(v => { g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(v)).attr('y2', y(v)).attr('stroke', css('--grid')); g.append('text').attr('class', 'lbl mut').attr('x', -6).attr('y', y(v) + 4).attr('text-anchor', 'end').text(pv(100 * v)); });
        const bw = x.bandwidth();
        rows.forEach(r => {
          const N = n(r), C = cyr(r); if (!N) return;
          const op = N < 20 ? .45 : 1;
          g.append('path').attr('d', colPath(x(r.y), ih, bw, 0, 3)).attr('fill', light).attr('opacity', op);
          if (C) g.append('path').attr('d', colPath(x(r.y), ih, bw, y(C / N), 3)).attr('fill', cc).attr('opacity', op);
        });
        // runs of years at exactly 100 % or 0 % get one bracket; other notable years their share on top
        const sh = rows.map(r => n(r) >= 20 ? cyr(r) / n(r) : null);
        const runs = []; let i = 0;
        while (i < rows.length) { const v = sh[i]; let j = i; if (v === 1 || v === 0) { while (j + 1 < rows.length && sh[j + 1] === v) j++; } if ((v === 1 || v === 0) && j - i >= 2) { runs.push([i, j, v]); i = j + 1; } else i++; }
        const used = [];
        runs.forEach(([a, b, v]) => {
          const xa = x(rows[a].y), xb = x(rows[b].y) + bw, yy = v === 1 ? -8 : y(0) - 8 - (v === 0 ? 0 : 0);
          if (v === 1) { g.append('path').attr('d', `M${xa},${yy + 4}V${yy}H${xb}V${yy + 4}`).attr('fill', 'none').attr('stroke', css('--text-3')); halo(g, (xa + xb) / 2, yy - 4, pv(100), 'middle', 'lbl strong'); }
          else { g.append('path').attr('d', `M${xa},${y(0) - 10}V${y(0) - 14}H${xb}V${y(0) - 10}`).attr('fill', 'none').attr('stroke', css('--text-3')); halo(g, (xa + xb) / 2, y(0) - 18, pv(0), 'middle', 'lbl mut'); }
          for (let k = a; k <= b; k++) used.push(k);
        });
        const lab = [];
        rows.forEach((r, k) => { if (used.includes(k) || sh[k] == null || sh[k] < .05) return; lab.push({ k, x: x(r.y) + bw / 2, v: sh[k] }); });
        lab.sort((a, b) => b.v - a.v);
        const placed = [];
        lab.forEach(p => { const txt = pv(100 * p.v), tw = textW(el, [txt], 'lbl') + 4;
          if (!placed.some(q => Math.abs(q - p.x) < tw)) { placed.push(p.x); halo(g, p.x, y(p.v) - 4, txt, 'middle', 'lbl'); }
          else if (ih - y(p.v) > 22 && bw >= 16) g.append('text').attr('class', 'lbl').attr('x', p.x).attr('y', y(p.v) + 13).attr('text-anchor', 'middle').style('fill', '#fff').style('font-size', bw >= 22 ? '10px' : '8.5px').text(txt.replace(' ', '')); });
        rows.forEach((r, k) => { if (r.y % (nwd ? 5 : 2) === 0 || k === rows.length - 1) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(nwd ? `’${String(r.y).slice(2)}` : r.y); });
        bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', bw).attr('y', -m.t).attr('height', ih + m.t),
          r => `<b>${name} · ${r.y}</b>` + trow(cc, L('ćirilicom', 'in Cyrillic'), `${fmt(cyr(r))} · ${pct(cyr(r), n(r))}`) + trow(null, L('latinicom', 'in Latin'), fmt(n(r) - cyr(r))) + (n(r) < 20 ? tq(L('manje od 20 akata (svjetlije)', 'fewer than 20 acts (lighter)')) : ''));
      };
      panel(L('Državni organi (Skupština, Vlada, ministarstva, druga tijela)', 'State bodies (Skupština, Government, ministries, other bodies)'), r => r.sc, st);
      panel(L('Opštine', 'Municipalities'), r => r.mc, mu);
      note(el, ['<vrsta>/<godina>/<PIS id>/0-uvod.md', 'tekst.md', 'clan-001.md'], fnw(sum(rows, r => st(r) + mu(r)), 'act'),
        L(`pismo je ono kojim je napisana većina slova početka teksta (preambule ili prvog člana), onako kako ga daje tekstualni sloj zvaničnog PDF-a; ništa nije transliterisano. Bez ${fnw(D.c03.unknown, 'act')} s premalo slova. Godine s manje od 20 akata nacrtane su svjetlije.`,
          `the script is the one most letters of the start of the text are in (the preamble or the first article), as the official PDF's text layer gives it; nothing is transliterated. ${fmt(D.c03.unknown)} acts with too few letters are left out. Years with fewer than 20 acts are drawn lighter.`));
      table(el, [t('year'), L('Državni, ćirilicom', 'State, Cyrillic'), L('Državni, ukupno', 'State, total'), L('Opštinski, ćirilicom', 'Municipal, Cyrillic'), L('Opštinski, ukupno', 'Municipal, total')],
        rows.map(r => [String(r.y), r.sc, st(r), r.mc, mu(r)]));
    }
  };
});

chart('c04', el => {
  const G = D.c04.groups, z = G.zakon, cols = S8(), ramp = seqRamp();
  const keys = ['neg', 'd0', 'd1', 'd27', 'd8', 'late'];
  const colors = [css('--muted-mark'), ramp(0.22), ramp(0.4), ramp(0.58), cols[0], cols[6]];
  const names = [L('prije objavljivanja', 'before publication'), L('istog dana', 'the same day'), L('narednog dana', 'the next day'), L('2–7 dana', '2–7 days'), L('osmog dana', 'the eighth day'), L('kasnije', 'later')];
  const GN = { zakon: ['Zakoni', 'Laws'], uredba: ['Uredbe Vlade', 'Government decrees'], pravilnik: ['Pravilnici', 'Rulebooks'], ostalo: ['Ostali opšti akti', 'Other general acts'],
    odl_state: ['Odluke državnih organa', 'Decisions of state bodies'], odl_mun: ['Odluke opština', 'Municipal decisions'], rjesenje: ['Rješenja', 'Rulings'] };
  const order = ['zakon', 'uredba', 'pravilnik', 'ostalo', 'odl_state', 'odl_mun', 'rjesenje'];
  const rows = order.map(k => ({ k, ...G[k] }));
  return {
    title: L(`Osmi dan: ${pct(z.d8, z.n)} zakona stupa na snagu osmog dana od objavljivanja, ${pct(z.d0, z.n)} istog dana`, `The eighth day: ${pct(z.d8, z.n)} of laws take effect on the eighth day after publication, ${pct(z.d0, z.n)} the same day`),
    dek: L(`Ustav (član 146): zakon i drugi propis „stupa na snagu najranije osmog dana od dana objavljivanja“, a izuzetno, kada za to postoje razlozi utvrđeni u postupku donošenja, najranije danom objavljivanja. Svaki red je vrsta akta: koliko je dana prošlo od objavljivanja do stupanja na snagu; desno je udio osmog dana. Odluke o imenovanjima i druga pojedinačna rješenja često stupaju na snagu danom donošenja, dakle prije objavljivanja.`,
      `The Constitution (Art. 146): a law or other regulation "takes effect no earlier than the eighth day after its publication", and exceptionally, when reasons for it are established in the adoption procedure, no earlier than the day of publication. Each row is a kind of act: how many days passed from publication to entry into force; on the right, the share on the eighth day. Decisions on appointments and other individual rulings often take effect on the day they are adopted, so before publication.`),
    draw(el) {
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      bands(el, rows, keys, colors, names, { label: r => L(...GN[r.k]), right: r => pct(r.d8 || 0, r.n), rowH: 34,
        tipExtra: d => trow(null, t('total'), fmt(d.n)) + (d.med != null ? trow(null, L('Medijana (dana)', 'Median (days)'), dec(d.med, 0)) : '') });
      note(el, ['data/laws.csv (published, in_force_days)', 'data/acts.json'], fnw(sum(rows, r => r.n), 'act'),
        L('dan stupanja na snagu je onaj koji PIS daje, provjeren prema odredbi samog akta o stupanju na snagu; kasniji dan početka primjene ne pomjera datum. Odluke su podijeljene prema donosiocu iz grafikona 2.',
          'the day of entry into force is the one the PIS gives, checked against the act\'s own commencement clause; a later application day does not move it. Decisions are split by their maker from chart 2.'));
      table(el, [L('Vrsta', 'Kind'), ...names, t('total')], rows.map(r => [L(...GN[r.k]), ...keys.map(k => r[k] || 0), r.n]));
    }
  };
});

part('p2', 'II. Skupština i zakoni', 'II. The Skupština and the laws',
  'Zakoni u registru i njihove preambule: koji ih je saziv Skupštine izglasao, na kom zasijedanju i kog dana, koje je Skupština izglasala po drugi put, o čemu su i koji se najčešće mijenjaju.',
  'The laws in the register and their preambles: which convocation of the Skupština voted them, at which session and on which day, which it voted a second time, what they are about and which change most.');

const SESS = { s: ['proljećnje redovno zasijedanje', 'spring regular session'], a: ['jesenje redovno zasijedanje', 'autumn regular session'], x: ['vanredno zasijedanje', 'extraordinary session'],
  o: ['posebna sjednica ili nenavedeno', 'special sitting or not stated'] };
const sess4 = s => (s === 's' || s === 'a' || s === 'x') ? s : 'o';
const ordEN = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
const sazivName = s => L(`${s}. saziv`, `${ordEN(s)} convocation`);

chart('c05', el => {
  const laws = D.c05.laws, cols = S8(), SK = ['s', 'a', 'x', 'o'], colors = [cols[2], cols[0], cols[1], css('--muted-mark')];
  const sz = [...new Set(laws.map(l => l[2]))].sort((a, b) => a - b);
  const st = s => { const v = laws.filter(l => l[2] === s), c = {}; SK.forEach(k => c[k] = v.filter(l => sess4(l[1]) === k).length);
    return { ...c, sz: s, n: v.length, a0: d3.min(v, l => l[0]), a1: d3.max(v, l => l[0]) }; };
  const S = sz.map(st), last = S[S.length - 1], prev = S.slice(0, -1);
  const shares = prev.map(s => 100 * s.x / s.n), lo = Math.round(d3.min(shares)), hi = Math.round(d3.max(shares));
  const byDay = d3.rollups(laws, v => v.length, l => l[0]).sort((a, b) => b[1] - a[1]), top = byDay[0];
  return {
    title: L(`Sazivi i zasijedanja: ${last.sz}. saziv izglasao je ${pct(last.x, last.n)} svojih važećih zakona na vanrednim zasijedanjima, raniji sazivi ${lo}–${hi}${PS()}`,
      `Convocations and sessions: the ${ordEN(last.sz)} convocation voted ${pct(last.x, last.n)} of its laws in force at extraordinary sessions, earlier convocations ${lo}–${hi}${PS()}`),
    dek: L(`Ustav (član 90): Skupština radi na dva redovna zasijedanja godišnje, od marta do kraja jula i od oktobra do kraja decembra; vanredno zasijedanje saziva se na zahtjev predsjednika Crne Gore, Vlade ili najmanje trećine poslanika. Preambula svakog zakona od 2009. kaže koji ga je saziv izglasao, na kom zasijedanju i kog dana. Svaka tačka je jedan važeći zakon, u mjesecu kada je izglasan; najviše važećih zakona izglasano je ${dateTxt(top[0])} (${fmt(top[1])}).`,
      `The Constitution (Art. 90): the Skupština sits in two regular sessions a year, from March to the end of July and from October to the end of December; an extraordinary session is called at the request of the President of Montenegro, the Government or at least a third of the MPs. Since 2009, each law's preamble says which convocation voted it, at which session and on which day. Each dot is one law in force, in the month it was voted; the most laws in force were voted on ${dateTxt(top[0])} (${fmt(top[1])}).`),
    draw(el) {
      const cards = el.append('div').attr('class', 'ptiles');
      S.forEach(s => {
        const d = cards.append('div').attr('class', 'ptile');
        d.append('div').attr('class', 'pn').text(`${sazivName(s.sz)} · ${s.a0.slice(0, 4)}–${s.sz === last.sz ? '' : s.a1.slice(0, 4)}`);
        d.append('div').attr('class', 'pv').html(`<b>${fmt(s.n)}</b> ${esc(nw(s.n, 'law'))}`);
        d.append('div').attr('class', 'ps').text(L(`${pct(s.x, s.n)} na vanrednim zasijedanjima`, `${pct(s.x, s.n)} at extraordinary sessions`));
        const bar = d.append('div').attr('class', 'pbar');
        SK.forEach((k, i) => { if (s[k]) bar.append('i').style('flex', s[k]).style('background', colors[i]); });
      });
      legend(el, SK.map((k, i) => ({ c: colors[i], l: L(...SESS[k]), shape: 'dot' })));
      const w = W(el), nwd = narrow(w);
      const months = d3.rollups(laws, v => v.sort((a, b) => SK.indexOf(sess4(a[1])) - SK.indexOf(sess4(b[1])) || a[0].localeCompare(b[0])), l => l[0].slice(0, 7));
      const maxN = d3.max(months, m => m[1].length), step = nwd ? 4.2 : 6, r = nwd ? 1.7 : 2.6;
      const m = { t: 44, r: 8, b: 24, l: 8 }, ih = maxN * step + 8, h = m.t + m.b + ih;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x0 = 2009, x1 = YEAR_LAST + 1, x = d3.scaleLinear().domain([x0, x1]).range([0, iw]);
      periodBands(g.append('g').attr('transform', `translate(0,${-m.t + 4})`), x, ih + m.t - 4, S.map(s => [[sazivName(s.sz), `${s.sz}.`], fy(s.a0), s.sz === last.sz ? x1 : fy(S[S.indexOf(s) + 1].a0)]), { minLabel: 20 });
      d3.range(x0, x1 + 1, nwd ? 4 : 2).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      const pts = [];
      months.forEach(([mo, v]) => { const cx = x(fy(mo + '-15')); v.forEach((l, k) => pts.push({ l, cx, cy: ih - 4 - k * step })); });
      bindTip(g.append('g').selectAll('circle').data(pts).join('circle').attr('cx', p => p.cx).attr('cy', p => p.cy).attr('r', r).attr('fill', p => colors[SK.indexOf(sess4(p.l[1]))]),
        p => `<b>${esc(p.l[3])}</b>` + trow(null, L('Izglasan', 'Voted'), dateTxt(p.l[0])) + trow(colors[SK.indexOf(sess4(p.l[1]))], sazivName(p.l[2]), L(...SESS[sess4(p.l[1])])) + trow(null, L('Objavljen', 'Published'), dateTxt(p.l[5])));
      const tm = months.find(mm => mm[0] === top[0].slice(0, 7)), tx = x(fy(tm[0] + '-15')), tyTop = ih - 4 - (tm[1].length - 1) * step - r - 2;
      const atxt = L(`${dateTxt(top[0])}: ${fnw(top[1], 'law')} u jednom danu`, `${dateTxt(top[0])}: ${fmt(top[1])} laws in one day`), atw = textW(el, [atxt], 'lbl strong');
      const anc = tx - atw / 2 < 0 ? 'start' : tx + atw / 2 > iw ? 'end' : 'middle', ay = -m.t + 40;
      g.append('line').attr('x1', tx).attr('x2', tx).attr('y1', ay + 3).attr('y2', tyTop).attr('stroke', css('--text-2')).attr('stroke-width', 1);
      halo(g, anc === 'start' ? Math.max(0, tx - 6) : anc === 'end' ? Math.min(iw, tx + 6) : tx, ay, atxt, anc, 'lbl strong');
      note(el, ['zakon/<godina>/<PIS id>/0-uvod.md (preambula)'], fnw(laws.length, 'law'),
        L(`saziv, zasijedanje i dan izglasavanja čitaju se iz preambule („Skupština Crne Gore 28. saziva, na … sjednici Drugog vanrednog zasijedanja u 2026. godini, dana …“); ${fnw(D.c05.no_preamble, 'law')} iz registra, uglavnom stariji od 2009, takvu preambulu nema. Samo zakoni koji su danas na snazi.`,
          `the convocation, session and day of the vote are read from the preamble ("the Skupština of Montenegro of the 28th convocation, at the … sitting of the Second Extraordinary Session in 2026, on …"); ${fmt(D.c05.no_preamble)} laws in the register, mostly older than 2009, have no such preamble. Only laws in force today.`));
      table(el, [L('Saziv', 'Convocation'), L('Od', 'From'), L('Do', 'To'), L('Zakona', 'Laws'), ...SK.map(k => L(...SESS[k]))], S.map(s => [sazivName(s.sz), s.a0, s.a1, s.n, ...SK.map(k => s[k])]));
    }
  };
});

const PRES = [['vujanovic', 'Filip Vujanović', '0000-00-00', '2018-05-20'], ['djukanovic', 'Milo Đukanović', '2018-05-20', '2023-05-20'], ['milatovic', 'Jakov Milatović', '2023-05-20', '9999-12-31']];
const presOn = d => PRES.find(p => d >= p[2] && d < p[3]);
const RV_EN = { 'zakon/2013/313978': 'Act on the Protection of State Interests in the Mining and Metallurgy Sector', 'zakon/2021/327793': 'Credit Institutions Resolution Act (amendments)',
  'zakon/2021/328248': 'Civil Servants and State Employees Act (amendments)', 'zakon/2021/330418': 'Credit Institutions Act (amendments)', 'zakon/2021/338921': 'Labour Act (amendment)',
  'zakon/2021/338971': 'Act on Freedom of Religion or Belief and the Legal Status of Religious Communities (amendments)', 'zakon/2021/338972': 'Act on Fiscalisation of Trade in Goods and Services (amendments)',
  'zakon/2022/333961': 'Act on the President of Montenegro (amendments)', 'zakon/2024/364759': 'Local Government Finance Act (amendments)', 'zakon/2024/373167': 'Inspection Act (amendments)',
  'zakon/2024/373181': 'Internal Affairs Act (amendments)', 'zakon/2024/373700': 'Compulsory Social Insurance Contributions Act (amendment)', 'zakon/2024/374037': 'Development Bank of Montenegro Act',
  'zakon/2024/375705': 'Act on the Security of Supply of Petroleum Products', 'zakon/2025/385612': 'Real Estate Tax Act (amendments)', 'zakon/2026/392221': 'National Security Agency Act',
  'zakon/2026/394466': 'Constitutional Court Act (amendments)', 'zakon/2026/396950': 'Act on the Status of the Descendants of the Petrović Njegoš Dynasty (amendments)' };
const shortCnr = s => { const m = s.match(/^Zakon o (?:izmjen\S*|dopun\S*)(?: i (?:izmjen\S*|dopun\S*))? Zakona o (.*)$/); return m ? `Zakon o ${m[1]} (izmjene)` : s; };

chart('c06', el => {
  const rv = D.c06.laws, cols = S8(), pc = [cols[6], cols[3], cols[0]];
  const days = r => Math.round((new Date(r[1]) - new Date(r[0])) / 864e5);
  const byDay = d3.rollups(rv, v => v.length, r => r[1]).sort((a, b) => b[1] - a[1]), top = byDay[0];
  const grp = PRES.map((p, i) => ({ p, i, rows: rv.filter(r => presOn(r[0]) === p) })).filter(g => g.rows.length);
  return {
    title: L(`Dva puta izglasani: ${fnw(rv.length, 'law')} na snazi Skupština je izglasala ponovo, ${fmt(top[1])} od njih ${dateTxt(top[0])}`, `Passed twice: the Skupština voted ${fmt(rv.length)} laws in force a second time, ${fmt(top[1])} of them on ${dateTxt(top[0])}`),
    dek: L(`Ustav (član 94): predsjednik Crne Gore dužan je da proglasi zakon u roku od sedam dana od usvajanja, odnosno tri dana ako je usvojen po hitnom postupku, ili da ga vrati Skupštini na ponovno odlučivanje, a ponovo izglasani zakon dužan je da proglasi. Preambula takvog zakona bilježi oba glasanja („… donijela je, a … ponovno izglasala“). Svaki red je jedan važeći zakon: koliko je dana prošlo od prvog do drugog glasanja.`,
      `The Constitution (Art. 94): the President of Montenegro must promulgate a law within seven days of its adoption, or three days if it was adopted by urgent procedure, or return it to the Skupština for a new decision, and must promulgate a law voted again. The preamble of such a law records both votes ("… adopted, and … voted again"). Each row is one law in force: how many days passed between the first and the second vote.`),
    draw(el) {
      const cards = el.append('div').attr('class', 'ptiles');
      grp.forEach(gr => { const d = cards.append('div').attr('class', 'ptile'), ds = gr.rows.map(days);
        d.append('div').attr('class', 'pn').text(gr.p[1] + (gr.i === 0 ? L(' (do 2018)', ' (to 2018)') : gr.i === 1 ? ' (2018–2023)' : L(' (od 2023)', ' (since 2023)')));
        d.append('div').attr('class', 'pv').html(`<b>${fmt(gr.rows.length)}</b> ${esc(nw(gr.rows.length, 'law'))}`);
        d.append('div').attr('class', 'ps').text(L(`medijana ${fnw(d3.median(ds), 'day')} do drugog glasanja`, `median ${fmt(d3.median(ds))} days to the second vote`));
        const bar = d.append('div').attr('class', 'pbar'); bar.append('i').style('flex', 1).style('background', pc[gr.i]); });
      const w = W(el), nwd = narrow(w), lab = r => L(shortCnr(r[2]), RV_EN[r[3]] || r[2]);
      const maxD = d3.max(rv, days), rr = nwd ? 0 : 150;
      const lw = nwd ? 0 : Math.min(470, d3.max(rv, r => d3.max(wrap2(el, lab(r), 440), s => textW(el, [s]))) + 14);
      const items = []; grp.forEach(gr => { items.push({ head: gr }); gr.rows.forEach(r => items.push({ r, gr })); });
      const lines = items.map(it => it.head ? [it.head.p[1]] : nwd ? wrap2(el, lab(it.r), w - 8) : wrap2(el, lab(it.r), lw - 14));
      const hs = items.map((it, i) => it.head ? 26 : nwd ? 13 * lines[i].length + 24 : Math.max(26, 13 * lines[i].length + 8));
      const tops = hs.reduce((a, hh) => a.concat(a[a.length - 1] + hh), [0]);
      const svg = svgIn(el, w, tops[tops.length - 1] + 36), g = svg.append('g').attr('transform', `translate(${lw},4)`);
      const iw = w - lw - rr - (nwd ? 70 : 0), x = d3.scaleLinear().domain([0, Math.max(30, maxD)]).nice().range([0, iw]);
      x.ticks(nwd ? 3 : 6).forEach(v => { g.append('line').attr('x1', x(v)).attr('x2', x(v)).attr('y1', 0).attr('y2', tops[tops.length - 1]).attr('stroke', css('--grid'));
        g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', tops[tops.length - 1] + 14).attr('text-anchor', 'middle').text(v); });
      g.append('text').attr('class', 'lbl mut').attr('x', iw).attr('y', tops[tops.length - 1] + 28).attr('text-anchor', 'end').text(L('dana između dva glasanja', 'days between the two votes'));
      items.forEach((it, i) => {
        const cy = tops[i];
        if (it.head) { g.append('text').attr('class', 'lbl strong big').attr('x', -lw).attr('y', cy + 18).style('fill', pc[it.head.i]).text(it.head.p[1]); return; }
        const r = it.r, dd = days(r), by = nwd ? cy + 13 * lines[i].length + 4 : cy + (hs[i] - 12) / 2;
        lines[i].forEach((ln, k) => g.append('text').attr('class', 'lbl strong').attr('x', nwd ? 0 : -10).attr('y', nwd ? cy + 11 + 13 * k : cy + hs[i] / 2 + 4 - 6.5 * (lines[i].length - 1) + 13 * k).attr('text-anchor', nwd ? 'start' : 'end').text(ln));
        g.append('path').attr('d', barPath(0, by, Math.max(2, x(dd)), 12, 3)).attr('fill', pc[it.gr.i]);
        g.append('text').attr('class', 'lbl').attr('x', x(dd) + 6).attr('y', by + 10).text(`${fmt(dd)} · ${dateShort(r[1])}`);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', hs[i]).datum(r),
          d => `<b>${esc(d[2])}</b>` + (CNR() ? '' : tq(RV_EN[d[3]] || '')) + trow(null, L('Prvo glasanje', 'First vote'), dateTxt(d[0])) + trow(null, L('Drugo glasanje', 'Second vote'), dateTxt(d[1])) + trow(null, L('Objavljen', 'Published'), dateTxt(d[4])));
      });
      note(el, ['zakon/<godina>/<PIS id>/0-uvod.md (preambula)'], fnw(rv.length, 'law'),
        L('samo zakoni koji su danas na snazi i čija preambula bilježi drugo glasanje; vraćeni zakon koji nije ponovo izglasan, ili je kasnije ukinut, ovdje nije. Predsjednik je onaj koji je bio na dužnosti na dan prvog glasanja.',
          'only laws in force today whose preamble records a second vote; a returned law that was not voted again, or was later repealed, is not here. The president is the one in office on the day of the first vote.'));
      table(el, [L('Zakon', 'Law'), L('Prvo glasanje', 'First vote'), L('Drugo glasanje', 'Second vote'), L('Dana', 'Days'), L('Predsjednik', 'President')],
        rv.map(r => [L(r[2], RV_EN[r[3]] || r[2]), r[0], r[1], days(r), presOn(r[0])[1]]));
    }
  };
});

chart('c07', el => {
  const A = D.c07.areas, P = D.c07.periods, cols = S8(), ink = cols[0];
  const keys = Object.keys(A).filter(k => k !== 'other').sort((a, b) => sum(P, p => A[b][p][0]) - sum(P, p => A[a][p][0]));
  const all = sum(Object.keys(A), k => sum(P, p => A[k][p][0])), am = sum(Object.keys(A), k => sum(P, p => A[k][p][1]));
  const lp = P[P.length - 1], nL = sum(Object.keys(A), k => A[k][lp][0]), aL = sum(Object.keys(A), k => A[k][lp][1]);
  const big = keys[0], other = sum(P, p => (A.other || {})[p] ? A.other[p][0] : 0);
  const pl = p => { const [a, b] = p.split('–'); return +a === 1992 ? L(`do ${b}.`, `to ${b}`) : `${a.slice(2)}–${b.slice(2)}`; };
  return {
    title: L(`Zakoni po oblastima: ${pct(am, all)} važećih zakona mijenja ili dopunjuje neki raniji zakon`, `Laws by area: ${pct(am, all)} of the laws in force amend or supplement an earlier law`),
    dek: L(`Svaka ploča je jedna oblast, svaki stubac period objavljivanja: svijetli stubac su svi važeći zakoni iz tog perioda, tamni oni koji mijenjaju ili dopunjuju neki raniji zakon, a broj iznad je njihov udio. Najviše je zakona iz oblasti „${L(...AREA_LAW[big]).toLowerCase()}“ (${fmt(sum(P, p => A[big][p][0]))}); od ${fmt(nL)} zakona ${plf(nL, 'objavljenog', 'objavljenih', 'objavljenih')} u periodu ${lp} izmjene i dopune su ${pct(aL, nL)}.`,
      `Each panel is one area, each column a period of publication: the light column is all laws in force from that period, the dark one those that amend or supplement an earlier law, and the number above is their share. Most laws are about ${L(...AREA_LAW[big]).toLowerCase()} (${fmt(sum(P, p => A[big][p][0]))}); of the ${fmt(nL)} laws published in ${lp}, ${pct(aL, nL)} are amendments.`),
    draw(el) {
      legend(el, [{ c: ink + '38', l: L('Svi važeći zakoni', 'All laws in force') }, { c: ink, l: L('Izmjene i dopune', 'Amending laws') }]);
      const box = el.append('div').attr('class', 'multi'), ymax = d3.max(keys, k => d3.max(P, p => A[k][p][0]));
      const panes = keys.map(() => box.append('div'));
      keys.forEach((k, i) => {
        const pn = panes[i], tt = sum(P, p => A[k][p][0]), ta = sum(P, p => A[k][p][1]);
        pn.append('h4').text(L(...AREA_LAW[k]));

          g.append('text').attr('class', 'lbl mut').attr('x', x0 + bw / 2).attr('y', ih + 14).attr('text-anchor', 'middle').style('font-size', '10px').text(pl(p));
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', -m.t).attr('height', ih + m.t).datum(p),
            q => `<b>${L(...AREA_LAW[k])} · ${q}</b>` + trow(null, L('Važećih zakona', 'Laws in force'), fmt(A[k][q][0])) + trow(ink, L('Izmjene i dopune', 'Amending laws'), `${fmt(A[k][q][1])} · ${pct(A[k][q][1], A[k][q][0])}`));

          `the area is read from the words in the title (for an amending law, from the name of the law it amends) by the rules in src/prep.py; ${fmt(other)} laws ratifying international treaties or of no recognised area are not shown. An amending law is one whose title begins "Zakon o izmjenama…", "… dopunama…", "… izmjeni…" or "… dopuni…" (on amendments / supplements to). The period ${lp} is partial (lighter).`));
      table(el, [L('Oblast', 'Area'), ...P.flatMap(p => [p, L('izmjene', 'amending')])], Object.keys(A).map(k => [L(...AREA_LAW[k]), ...P.flatMap(p => A[k][p])]));
    }

});

chart('c08', el => {
  const c = D.c08, rows = c.rows.slice(0, 20), Y0 = 2006, YRS = d3.range(Y0, YEAR_LAST + 1), ramp = seqRamp();
  const top = rows[0], firstY = d3.min(top.years);
  return {
    title: L(`Najčešće mijenjani zakoni: ${top.name} mijenjan je ${fmt(top.years.length)} puta od ${firstY}.`, `The most-amended laws: the ${lawEN(top.name)} was amended ${fmt(top.years.length)} times from ${firstY}`),
    dek: L(`Svaki red je jedan zakon, svaka ćelija jedna godina: koliko je važećih zakona o izmjenama ili dopunama tog zakona te godine objavljeno; desno je ukupno. Od ${fmt(c.laws)} zakona u registru ${fmt(c.amending)} mijenja neki drugi zakon (${fmt(c.bases)} različitih). Službeni list ne objavljuje prečišćene tekstove, pa je u repozitorijumu svaki zakon onakav kakav je objavljen, a izmjene su zasebni akti.`,
      `Each row is one law, each cell one year: how many laws in force amending or supplementing that law were published that year; on the right, the total. Of the ${fmt(c.laws)} laws in the register, ${fmt(c.amending)} amend another law (${fmt(c.bases)} different ones). The Službeni list publishes no consolidated texts, so each law is in the repository as published, and its amendments are separate acts.`),
    draw(el) {
      const w = W(el), nwd = narrow(w), yrs = nwd ? YRS.filter(y => y >= 2013) : YRS, cw0 = nwd ? (w - 34) / (yrs.length + 1) : null;
      const labs = rows.map(r => lawName(r.name)), lw = nwd ? 0 : Math.min(330, textW(el, labs) + 14);
      const rowH = nwd ? 34 : 22, m = { t: 22, r: nwd ? 30 : 54, b: 4, l: lw };
      const iw = w - m.l - m.r, cols = yrs.length + 1, cw = iw / cols, h = m.t + m.b + rowH * rows.length;
      const mx = d3.max(rows, r => d3.max([...d3.rollup(r.years, v => v.length, y => y).values()])), col = n => ramp(0.2 + 0.8 * Math.sqrt(n / mx));
      legend(el, d3.range(1, mx + 1).map(n => ({ c: col(n), l: n === mx ? L(`${n} u godini`, `${n} in a year`) : String(n) })).concat([{ c: css('--surface-2'), l: L('nijedna', 'none') }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const head = [L(`do ${yrs[0] - 1}.`, `to ${yrs[0] - 1}`), ...yrs];
      head.forEach((y, j) => { if (j === 0 || (typeof y === 'number' && y % (nwd ? 4 : 5) === 0)) g.append('text').attr('class', 'lbl').attr('x', j === 0 && nwd ? 0 : j * cw + cw / 2).attr('y', -8).attr('text-anchor', j === 0 && nwd ? 'start' : 'middle').text(y); });
      const xb = d3.scaleLinear().domain([0, d3.max(rows, r => r.years.length)]).range([0, m.r - (nwd ? 26 : 30)]);
      rows.forEach((r, i) => {
        const cy = i * rowH + (nwd ? 13 : 0), by = d3.rollup(r.years, v => v.length, y => y < yrs[0] ? 0 : y);
        if (nwd) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy - 3).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(labs[i]);
        head.forEach((y, j) => { const n = by.get(j === 0 ? 0 : y) || 0;
          g.append('rect').attr('x', j * cw + 1).attr('y', cy + 2).attr('width', Math.max(1, cw - 2)).attr('height', (nwd ? 18 : rowH) - 4).attr('rx', Math.min(3, cw / 3)).attr('fill', n ? col(n) : css('--surface-2')); });
        if (!nwd) g.append('path').attr('d', barPath(iw + 8, cy + 6, iw + 8 + xb(r.years.length), rowH - 12, 2)).attr('fill', css('--s1'));
        g.append('text').attr('class', 'lbl').attr('x', iw + (nwd ? 6 : 12 + xb(r.years.length))).attr('y', cy + 15).text(r.years.length);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', cy - (nwd ? 13 : 0)).attr('height', rowH).datum(r),
          d => `<b>${esc(lawName(d.name))}</b>` + (CNR() ? '' : tq(d.name)) + trow(null, L('Izmjena u registru', 'Amending laws in the register'), fmt(d.years.length)) +
            trow(null, L('Po godinama', 'By year'), [...d3.rollup(d.years, v => v.length, y => y)].sort((a, b) => a[0] - b[0]).map(([y, n]) => n > 1 ? `${y}×${n}` : y).join(', ')) +
            (d.held ? trow(null, L('Još van repozitorijuma', 'Not yet in the repository'), fmt(d.held)) : '') + (d.base_y ? trow(null, L('Sam zakon objavljen', 'The law itself published'), d.base_y) : trow(null, L('Sam zakon', 'The law itself'), L('nije u registru', 'not in the register'))));
      });
      note(el, ['data/acts.json (naslovi zakona)', 'data/held.json'], fnw(sum(rows, r => r.years.length), 'law'),
        L('zakon koji se mijenja čita se iz naslova („Zakon o izmjenama i dopunama Zakona o …“). Broje se samo izmjene koje su danas na snazi i u registru; izmjene koje PIS vodi kao važeće, a repozitorijum ih još nema (data/held.json), navedene su u oblačiću i u tabeli, bez godine. Godina ' + YEAR_LAST + '. je nepotpuna.',
          'the law being changed is read from the title ("Zakon o izmjenama i dopunama Zakona o …", on amendments to the law on …). Only amending laws in force and in the register count; those the PIS marks in force but the repository does not hold yet (data/held.json) are given in the tooltip and the table, with no year. ' + YEAR_LAST + ' is partial.'));
      table(el, [L('Zakon', 'Law'), L('Izmjena u registru', 'In the register'), L('Prva', 'First'), L('Posljednja', 'Last'), L('Još van repozitorijuma', 'Held back'), L('Zakon objavljen', 'Law published')],
        c.rows.map(r => [lawName(r.name), r.years.length, yearTxt(d3.min(r.years)), yearTxt(d3.max(r.years)), r.held, yearTxt(r.base_y)]));
    }

part('p3', 'III. Podzakonski akti, Evropska unija i pravni osnov', 'III. Bylaws, the European Union and the legal basis',
  'Iz samih tekstova: koji akti navode propise Evropske unije, na osnovu kojih zakona se donose pravilnici i uredbe, iz kojih službenih listova potiču propisi na koje se pozivaju, ko piše pravilnike i šta je ostalo od pandemije.',

const lawGenTitle = n => n;

chart('c09', el => {
  const R = D.c09.rows, Y0 = 2006, K = ['zakon', 'uredba', 'pravilnik'], cols = S8();

  const get = (k, y) => (R[k].find(r => r[0] === y) || [y, 0, 0]);
  const z = get('zakon', YEAR_LAST), p = get('pravilnik', YEAR_LAST), u = get('uredba', YEAR_LAST);

    dek: L(`Svaka ploča je jedna vrsta akta, svaki stubac godina objavljivanja: svijetli stubac su svi važeći akti iz te godine, tamni oni čiji tekst navodi propis Evropske unije (direktivu, uredbu ili odluku s oznakom EU, EZ ili EEZ, ili broj poput 2001/83/EZ), a broj iznad je njihov udio. Od važećih zakona iz ${Y0}–2023. takvih je ${pct(zoe, zon)}; od zakona iz ${YEAR_LAST}. ${pct(z[2], z[1])}, od uredbi ${pct(u[2], u[1])}, a od pravilnika ${pct(p[2], p[1])}.`,
      `Each panel is one kind of act, each column a year of publication: the light column is all acts in force from that year, the dark one those whose text cites European Union legislation (a directive, regulation or decision marked EU, EC or EEC, or a number such as 2001/83/EC), and the number above is their share. Of the laws in force from ${Y0}–2023, ${pct(zoe, zon)} do; of the laws of ${YEAR_LAST}, ${pct(z[2], z[1])}, of its decrees ${pct(u[2], u[1])} and of its rulebooks ${pct(p[2], p[1])}.`),
    draw(el) {
      const ink = cols[0];
      legend(el, [{ c: ink + '38', l: L('Svi važeći akti', 'All acts in force') }, { c: ink, l: L('Tekst navodi akt EU', 'The text cites an EU act') }]);
      K.forEach(k => {
        const rows = d3.range(Y0, YEAR_LAST + 1).map(y => get(k, y)), tn = sum(rows, r => r[1]), te = sum(rows, r => r[2]);
        h4(el, `${L(...KN[k])} · ${L(`akt EU navodi ${fmt(te)} od ${fmt(tn)} (${Y0}–${YEAR_LAST})`, `${fmt(te)} of ${fmt(tn)} cite an EU act (${Y0}–${YEAR_LAST})`)}`, 10);
        const w = W(el), nwd = narrow(w), h = 132, m = { t: 18, r: 4, b: 20, l: 4 };
        const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(rows.map(r => r[0])).range([0, iw]).padding(0.2), y = d3.scaleLinear().domain([0, d3.max(rows, r => r[1])]).range([ih, 0]);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        const bw = x.bandwidth(), lastY = YEAR_LAST, tw = textW(el, [pv(100)], 'lbl');
        rows.forEach(([yy, n, e], j) => {
          const x0 = x(yy), op = yy === lastY ? .7 : 1;
          if (n) g.append('path').attr('d', colPath(x0, ih, bw, y(n))).attr('fill', ink).attr('fill-opacity', .2 * op);
          if (e) g.append('path').attr('d', colPath(x0, ih, bw, y(e))).attr('fill', ink).attr('fill-opacity', op);
          const showP = e && n >= 10 && (!nwd || yy >= YEAR_LAST - 2) && (x.step() >= tw || yy >= YEAR_LAST - 2 || j % 2 === 0);
          if (showP) g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', y(n) - 4).attr('text-anchor', 'middle').text(pct(e, n));
          if (yy % (nwd ? 5 : 2) === 0 || yy === lastY) g.append('text').attr('class', 'lbl mut').attr('x', x0 + bw / 2).attr('y', ih + 14).attr('text-anchor', 'middle').text(nwd ? `’${String(yy).slice(2)}` : yy);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', -m.t).attr('height', ih + m.t).datum([yy, n, e]),
            d => `<b>${L(...KN[k])} · ${d[0]}${d[0] === lastY ? ' (' + t('partial') + ')' : ''}</b>` + trow(null, L('Važećih', 'In force'), fmt(d[1])) + trow(ink, L('Navode akt EU', 'Cite an EU act'), `${fmt(d[2])} · ${pct(d[2], d[1])}`));
        });
      });
      note(el, ['zakon/', 'uredba/', 'pravilnik/ (svi fajlovi svakog akta)'], fnw(sum(K, k => sum(R[k], r => r[1])), 'act'),
        L(`broji se akt čiji tekst navodi akt EU (pravila u src/prep.py); zakon usklađen s pravom EU koji ga u tekstu ne navodi ovdje nije. Naslovi ${fnw(starN, 'act')} (od ${starY}.) završavaju zvjezdicom: to je oznaka fusnote o prenošenju propisa EU („* U ovu naredbu prenijeta je Uredba Komisije (EU) …“, naredba/2016/309462/tekst.md), ali tekstovi podijeljeni na članove fusnotu ne čuvaju. ${YEAR_LAST}. je nepotpuna (svjetlija).`,
          `an act counts when its text cites an EU act (rules in src/prep.py); a law aligned with EU law that does not cite it in its text is not counted. The titles of ${fmt(starN)} acts (from ${starY}) end with an asterisk, the mark of a footnote on transposing EU legislation ("* U ovu naredbu prenijeta je Uredba Komisije (EU) …", this order transposes Commission Regulation (EU) …, naredba/2016/309462/tekst.md), but texts split into articles do not keep the footnote. ${YEAR_LAST} is partial (lighter).`));
      table(el, [t('year'), ...K.flatMap(k => [L(...KN[k]), 'EU'])], d3.range(Y0, YEAR_LAST + 1).map(y => [String(y), ...K.flatMap(k => { const r = get(k, y); return [r[1], r[2]]; })]));

});

const BYK = ['pravilnik', 'uredba', 'naredba', 'uputstvo', 'pravila'];
const BYN = { pravilnik: ['pravilnici', 'rulebooks'], uredba: ['uredbe Vlade', 'Government decrees'], naredba: ['naredbe', 'orders'], uputstvo: ['uputstva', 'instructions'], pravila: ['pravila', 'rules'] };
chart('c10', el => {
  const c = D.c10, rows = c.rows, top = rows[0], cols = S8(), colors = [cols[2], cols[6], cols[1], cols[3], cols[4]];
  const nPod = n => CNR() ? plf(n, 'podzakonski akt', 'podzakonska akta', 'podzakonskih akata') : (n === 1 ? 'bylaw' : 'bylaws');
  return {
    title: L(`Na osnovu kojeg zakona: ${top.name} pravni je osnov za ${fmt(top.n)} ${nPod(top.n)}`, `On which law: the ${lawEN(top.name)} is the legal basis of ${fmt(top.n)} bylaws`),
    dek: L(`Pravilnik, uredba, naredba ili uputstvo počinje pravnim osnovom („Na osnovu člana 56 stav 2 Zakona o energetici …“). Ovdje je, za svaki takav važeći akt, prvi zakon naveden u osnovu: našao se za ${fmt(c.with_basis)} od ${fmt(c.bylaws)} akata, a različitih zakona je ${fmt(c.distinct)}. Prvi na listi je osnov za ${fmt(top.kinds.naredba || 0)} naredbi, većinom iz pandemije (grafikon 13).`,
      `A rulebook, decree, order or instruction opens with its legal basis ("Pursuant to Article 56(2) of the Energy Act …"). Here, for each such act in force, is the first law its basis names: one was found for ${fmt(c.with_basis)} of ${fmt(c.bylaws)} acts, ${fmt(c.distinct)} different laws in all. The first on the list is the basis of ${fmt(top.kinds.naredba || 0)} orders, most of them from the pandemic (chart 13).`),

      splitBars(el, rows.map(r => ({ ...r, ...r.kinds })), BYK, colors, BYK.map(k => L(...BYN[k])), { label: r => lawName(r.name), rowH: 24, cap: 440,
        tipExtra: d => trow(null, L('Objavljeni', 'Published'), `${d.first}–${d.last}`) + (CNR() ? '' : tq(d.name)) });
      note(el, ['<vrsta>/<godina>/<PIS id>/0-uvod.md (preambula)'], fmt(c.with_basis) + ' ' + nPod(c.with_basis),
        L('zakon je prvi naziv „Zakona o …“ poslije riječi „Na osnovu“; isti naziv se broji zajedno i kad se radi o dva zakona iz različitih godina (stari i novi zakon istog naziva). Osnov koji se poziva samo na drugi podzakonski akt ili statut ne broji se.',
          'the law is the first "Zakon o …" (Act on …) after "Na osnovu" (pursuant to); the same name counts together even when it covers two laws from different years (an old and a new act of the same title). A basis that names only another bylaw or a statute does not count.'));
      table(el, [L('Zakon', 'Law'), ...BYK.map(k => L(...BYN[k])), t('total'), L('Prvi', 'First'), L('Posljednji', 'Last')], rows.map(r => [lawName(r.name), ...BYK.map(k => r.kinds[k] || 0), r.n, yearTxt(r.first), yearTxt(r.last)]));

const ERA = { SFRJ: ['Službeni list SFRJ (savezni)', 'Gazette of the SFRY (federal)'], SRCG: ['Službeni list SR Crne Gore', 'Gazette of the Socialist Republic of Montenegro'],
  FED: ['Službeni list SRJ i SCG (savezni)', 'Gazettes of the FRY and of Serbia and Montenegro'], RCG: ['Službeni list Republike Crne Gore', 'Gazette of the Republic of Montenegro'],
  CG: ['Službeni list Crne Gore', 'Gazette of Montenegro'], none: ['bez navedenog službenog lista', 'no gazette cited'] };
chart('c15', el => {
  const rows = D.c15.rows.map(r => ({ y: r.y, SFRJ: r.SFRJ || 0, SRCG: r.SRCG || 0, FED: (r.SRJ || 0) + (r.SCG || 0), RCG: r.RCG || 0, CG: r.CG || 0, none: r.none || 0 }));
  const K = ['SFRJ', 'SRCG', 'FED', 'RCG', 'CG', 'none'], tot = r => sum(K, k => r[k]), old = r => r.SFRJ + r.SRCG + r.FED + r.RCG;
  const last = rows[rows.length - 1], firstCG = (rows.find(r => r.CG > r.RCG) || last).y;
  const e = rows.filter(r => r.y <= 1995), eSF = sum(e, r => r.SFRJ + r.SRCG), eN = sum(e, tot);
  return {
    title: L(`Stari pravni osnov: ${pct(old(last), tot(last))} akata iz ${last.y}. oslanja se na propis iz Službenog lista Republike Crne Gore ili starijeg`, `An older legal basis: ${pct(old(last), tot(last))} of the acts of ${last.y} rest on an act from the Gazette of the Republic of Montenegro or an older one`),
    dek: L(`Pravni osnov u preambuli navodi propis i službeni list u kojem je objavljen („Zakona o lokalnoj samoupravi („Sl. list RCG“, br. 42/03 …)“). Za svaki važeći akt osim zakona uzet je najstariji službeni list koji njegov osnov navodi; svaki red je jedan list, svaka ćelija jedna godina objavljivanja, a boja je udio akata te godine. Od akata iz 1992–1995 njih ${pct(eSF, eN)} poziva se na Službeni list SFRJ ili SR Crne Gore; Službeni list Crne Gore postaje najčešći najstariji osnov tek ${firstCG}. godine.`,
      `The legal basis in a preamble names an act and the gazette it was published in ("the Local Self-Government Act ("Sl. list RCG", no. 42/03 …)"). For each act in force other than laws, the oldest gazette its basis names is taken; each row is one gazette, each cell one year of publication, and the colour is the share of that year's acts. Of the acts of 1992–1995, ${pct(eSF, eN)} rest on the Official Gazette of the SFRY or of the Socialist Republic of Montenegro; the Official Gazette of Montenegro becomes the most frequent oldest basis only in ${firstCG}.`),

function tileMap(el, vals, color, label, tipFn, opt = {}) {
  const w = W(el), nwd = narrow(w), cols = 8, rows = 8, gap = 3;
  const mapW = nwd ? w : Math.min(w * 0.56, 560), cs = Math.min(70, (mapW - 2) / cols), s = cs - gap;
  const box = el.append('div').attr('class', 'twocol'), left = box.append('div'), right = box.append('div');
  const svg = svgIn(left, cols * cs + 2, rows * cs + 2), g = svg.append('g').attr('transform', 'translate(1,1)');
  Object.entries(MUNPOS).forEach(([k, [cx, cy]]) => {
    const v = vals[k], x0 = cx * cs, y0 = cy * cs, fill = color(v), ink = inkOn(fill);
    const cell = g.append('g');
    cell.append('rect').attr('x', x0).attr('y', y0).attr('width', s).attr('height', s).attr('rx', 8).attr('fill', fill);
    const nm = s >= 62 ? MUN[k] : MUNAB[k], fs = s >= 62 ? 10 : 11;
    const lines = s >= 62 && textW(left, [nm], 'lbl') > s - 6 ? nm.split(' ') : [nm];
    lines.forEach((ln, i) => cell.append('text').attr('class', 'lbl').attr('x', x0 + s / 2).attr('y', y0 + s / 2 - 4 - 6 * (lines.length - 1) + 12 * i).attr('text-anchor', 'middle').style('font-size', fs + 'px').style('fill', ink).style('pointer-events', 'none').text(ln));
    cell.append('text').attr('class', 'lbl strong').attr('x', x0 + s / 2).attr('y', y0 + s / 2 + 10 + 6 * (lines.length - 1)).attr('text-anchor', 'middle').style('fill', ink).style('pointer-events', 'none').text(label(v));
    bindTip(cell.append('rect').attr('class', 'hit').attr('x', x0).attr('y', y0).attr('width', s).attr('height', s).datum(k), tipFn);
  });
  return { left, right };
}

  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG === 'cnr' ? 'cnr' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[PF.acts, ['važeći akt u registru', 'važeća akta u registru', 'važećih akata u registru'], 'acts in force in the register'],
    [PF.laws, ['zakon', 'zakona', 'zakona'], 'laws'], [PF.municipal, ['opštinski akt', 'opštinska akta', 'opštinskih akata'], 'municipal acts'],
    [PF.amendments, ['amandman na Ustav', 'amandmana na Ustav', 'amandmana na Ustav'], 'amendments to the Constitution'],
    [PF.commits, ['commit u istoriji gita', 'commita u istoriji gita', 'commitova u istoriji gita'], 'commits in the git history'],
    [PF.held, ['važeći akt još van repozitorijuma', 'važeća akta još van repozitorijuma', 'važećih akata još van repozitorijuma'], 'acts in force not yet in the repository']];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${fmt(d[0])}</b><span>${esc(CNR() ? plf(d[0], ...d[1]) : d[2])}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.cnr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dcnr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.cnr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('me-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('me-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
