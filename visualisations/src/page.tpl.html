<!doctype html>
<html lang="cnr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crnogorsko pravo u 20 grafikona</title>
<meta name="description" content="Dvadeset grafikona o crnogorskom pravu iz repozitorijuma montenegro-law / Twenty charts on Montenegrin law from the montenegro-law repository">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.25 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.35 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, currentColor 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid; border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.lbl.big { font-size: 12px; }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; min-height: 2.8em; display: flex; align-items: flex-end; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.amlist { font-size: 12px; line-height: 1.45; }
.amlist .ar { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.amlist .ar b { font-weight: 600; font-variant-numeric: tabular-nums; }
.amlist .ar span:nth-child(2) { color: var(--text); }
.amlist .ar span:last-child { color: var(--text-2); white-space: nowrap; }
.amlist .ar i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 760px) { .twocol { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Jezik / Language"><button data-lang="cnr">CNR</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Tema / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
let LANG = 'cnr';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'cnr') LANG = q; else { const s = localStorage.getItem('me-viz-lang'); if (s === 'en' || s === 'cnr') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('me-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ strings
const S = {
cnr: {
  title: 'Crnogorsko pravo u 20 grafikona',
  lede: 'Dvadeset grafikona nacrtanih samo iz podataka ovog repozitorijuma: važeći akti iz pravnog informacionog sistema Službenog lista Crne Gore, od zakona do opštinskih odluka, sa tekstovima i preambulama, Ustav i amandmani na Ustav i ukazi o ambasadorima.',
  profile_h: 'Profil podataka: šta je korišćeno i koliko je potpuno',
  tbl: 'Tabela sa podacima', src: 'Izvor u repozitorijumu', n: 'Zapisa', cover: 'Obuhvat', caveat: 'Ograničenje', ds: 'Skup podataka',
  foot: 'Napravljeno iz repozitorijuma lexifina/montenegro-law ({built}). Brojeve računa skripta visualisations/src/prep.py iz tabela u data/, iz istorije gita i iz samih tekstova akata; stranicu sklapa build.py. Svi grafikoni su opisni: pokazuju šta izvori bilježe, ne zašto.',
  year: 'Godina', total: 'Ukupno', share: 'Udio', partial: 'nepotpuna godina',
  gl: 'Grafikoni o pravu svih zemalja, iz cijelog global-law-a: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Ovdje su samo grafikoni o Crnoj Gori.',
},
en: {
  title: 'Montenegrin law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the acts in force from the Službeni list Crne Gore\'s legal information system, from laws to municipal decisions, with their texts and preambles, the Constitution and its amendments, and the decrees on ambassadors.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit', ds: 'Dataset',
  foot: 'Built from the lexifina/montenegro-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the tables in data/, the git history and the texts of the acts themselves; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  year: 'Year', total: 'Total', share: 'Share', partial: 'partial year',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Montenegro alone.',
}};
const t = k => S[LANG][k];
const CNR = () => LANG === 'cnr';
const L = (cnr, en) => CNR() ? cnr : en;
const grp = (s, sep) => s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
const fmt = n => { if (n == null || isNaN(n)) return '–'; const v = Math.round(+n); return (v < 0 ? '−' : '') + grp(String(Math.abs(v)), CNR() ? '.' : ','); };
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d), [i, f] = s.split('.'); return (+v < 0 ? '−' : '') + grp(i, CNR() ? '.' : ',') + (f ? (CNR() ? ',' : '.') + f : ''); };
const PS = () => CNR() ? ' %' : '%';
const pct = (a, b, d = 0) => b ? dec(100 * a / b, d) + PS() : '–';
const pv = (v, d = 0) => dec(v, d) + PS();
const yearTxt = v => v == null || v === '' ? '–' : String(v);   // years print plain (2015), never grouped like counts
// plural forms: 1 zakon, 2–4 zakona, 5+ zakona (21 zakon, 22 zakona, 25 zakona; 11–14 take the third form)
const plf = (n, one, few, many) => { n = Math.abs(Math.round(n)); const tt = n % 100, u = n % 10; return (u === 1 && tt !== 11) ? one : (u >= 2 && u <= 4 && (tt < 12 || tt > 14)) ? few : many; };
const NW = { law: ['zakon', 'zakona', 'zakona', 'law', 'laws'], act: ['akt', 'akta', 'akata', 'act', 'acts'], dec: ['odluka', 'odluke', 'odluka', 'decision', 'decisions'],
  rule: ['pravilnik', 'pravilnika', 'pravilnika', 'rulebook', 'rulebooks'], ukaz: ['ukaz', 'ukaza', 'ukaza', 'decree', 'decrees'], day: ['dan', 'dana', 'dana', 'day', 'days'],
  year: ['godina', 'godine', 'godina', 'year', 'years'], prov: ['odredba', 'odredbe', 'odredbi', 'provision', 'provisions'], am: ['amandman', 'amandmana', 'amandmana', 'amendment', 'amendments'],
  commit: ['commit', 'commita', 'commitova', 'commit', 'commits'], mun: ['opština', 'opštine', 'opština', 'municipality', 'municipalities'] };
const nw = (n, k) => { const w = NW[k]; return CNR() ? plf(n, w[0], w[1], w[2]) : (Math.abs(n) === 1 ? w[3] : w[4]); };
const fnw = (n, k) => fmt(n) + ' ' + nw(n, k);
const MGEN = ['januara', 'februara', 'marta', 'aprila', 'maja', 'juna', 'jula', 'avgusta', 'septembra', 'oktobra', 'novembra', 'decembra'];
const MNOM = ['januar', 'februar', 'mart', 'april', 'maj', 'jun', 'jul', 'avgust', 'septembar', 'oktobar', 'novembar', 'decembar'];
const MSH = { cnr: ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'avg', 'sep', 'okt', 'nov', 'dec'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dateTxt = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return CNR() ? `${d}. ${MGEN[m - 1]} ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return CNR() ? `${d}. ${m}. ${y}.` : `${d} ${MSH.en[m - 1]} ${y}`; };
const monthTxt = s => { const [y, m] = s.split('-').map(Number); return CNR() ? `${MNOM[m - 1]} ${y}.` : `${MEN[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const YEAR_LAST = +PF.built.slice(0, 4);

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;
const tq = s => `<div class="q">${esc(s)}</div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c).style('color', it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
  return d;
}
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(s)}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + esc(extra) : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {

        const used = [];

        rows.map(r => [String(r.y), r.sc, st(r), r.mc, mu(r)]));

part('p2', 'II. Skupština i zakoni', 'II. The Skupština and the laws',

  'The laws in the register and their preambles: which convocation of the Skupština voted them, at which session and on which day, which it voted a second time, what they are about and which change most.');

const SESS = { s: ['proljećnje redovno zasijedanje', 'spring regular session'], a: ['jesenje redovno zasijedanje', 'autumn regular session'], x: ['vanredno zasijedanje', 'extraordinary session'],
  o: ['posebna sjednica ili nenavedeno', 'special sitting or not stated'] };
const sess4 = s => (s === 's' || s === 'a' || s === 'x') ? s : 'o';
const ordEN = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
const sazivName = s => L(`${s}. saziv`, `${ordEN(s)} convocation`);

chart('c05', el => {
  const laws = D.c05.laws, cols = S8(), SK = ['s', 'a', 'x', 'o'], colors = [cols[2], cols[0], cols[1], css('--muted-mark')];
  const sz = [...new Set(laws.map(l => l[2]))].sort((a, b) => a - b);
  const st = s => { const v = laws.filter(l => l[2] === s), c = {}; SK.forEach(k => c[k] = v.filter(l => sess4(l[1]) === k).length);
    return { ...c, sz: s, n: v.length, a0: d3.min(v, l => l[0]), a1: d3.max(v, l => l[0]) }; };
  const S = sz.map(st), last = S[S.length - 1], prev = S.slice(0, -1);
  const shares = prev.map(s => 100 * s.x / s.n), lo = Math.round(d3.min(shares)), hi = Math.round(d3.max(shares));
  const byDay = d3.rollups(laws, v => v.length, l => l[0]).sort((a, b) => b[1] - a[1]), top = byDay[0];
  return {
    title: L(`Sazivi i zasijedanja: ${last.sz}. saziv izglasao je ${pct(last.x, last.n)} svojih važećih zakona na vanrednim zasijedanjima, raniji sazivi ${lo}–${hi}${PS()}`,

part('p3', 'III. Podzakonski akti, Evropska unija i pravni osnov', 'III. Bylaws, the European Union and the legal basis',

          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', -m.t).attr('height', ih + m.t).datum([yy, n, e]),

        k => `<b>${MUN[k]}</b>` + trow(null, L('Važećih akata', 'Acts in force'), fmt(val(k))) + trow(null, L('Najstariji iz', 'Oldest from'), String(M[k].first)));
      const rows = srt.map(k => ({ k, dec: M[k].kinds.dec || 0, oth: val(k) - (M[k].kinds.dec || 0) }));
      splitBars(T.right, rows, ['dec', 'oth'], [cols[3], css('--muted-mark')], [L('odluke', 'decisions'), L('rješenja i drugi akti', 'rulings and other acts')], { label: r => MUN[r.k], rowH: 19, cap: 120, rr: 46, left: true });
      note(el, ['<vrsta>/<godina>/<PIS id>/0-uvod.md (donosilac)'], fnw(all, 'act'),
        L(`opština je ona čiji organ je donio akt (skupština, predsjednik opštine, gradonačelnik, opštinska izborna komisija…), ili čiji statut navodi pravni osnov; akti gradskih opština Tuzi i Golubovci računaju se uz Tuzi i Zetu. Za ${fnw(M['?'] ? M['?'].n : 0, 'act')} opština nije prepoznata. Narandžasto: odluke, sivo: rješenja i drugi akti.`,
          `the municipality is the one whose body made the act (the assembly, the mayor, the municipal election commission…), or whose statute its legal basis names; acts of the urban municipalities of Tuzi and Golubovci count with Tuzi and Zeta. For ${fmt(M['?'] ? M['?'].n : 0)} acts the municipality was not recognised. Orange: decisions; grey: rulings and other acts.`));
      table(el, [L('Opština', 'Municipality'), L('Važećih akata', 'Acts in force'), L('Odluke', 'Decisions'), L('Najstariji iz', 'Oldest from')], srt.map(k => [MUN[k], val(k), M[k].kinds.dec || 0, String(M[k].first)]));
    }
  };
});

chart('c18', el => {
  const M = D.c17.mun, keys = Object.keys(MUN).filter(k => M[k]), cols = S8();
  const sh = k => (M[k].cyr + M[k].lat) ? M[k].cyr / (M[k].cyr + M[k].lat) : 0;
  const srt = keys.slice().sort((a, b) => sh(b) - sh(a)), hi = srt[0], zero = srt.filter(k => M[k].cyr === 0);
  const join = arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + L(' i ', ' and ') + arr[arr.length - 1] : arr[0];
  return {
    title: L(`Ćirilica po opštinama: u ${MLOCN[hi]} ${pct(M[hi].cyr, M[hi].cyr + M[hi].lat)} akata, ${zero.length ? 'u ' + join(zero.map(k => MLOCN[k])) + ' nijedan' : ''}`,
      `Cyrillic by municipality: ${pct(M[hi].cyr, M[hi].cyr + M[hi].lat)} of acts in ${MUN[hi]}, ${zero.length ? 'none in ' + join(zero.map(k => MUN[k])) : ''}`),
    dek: L(`Isti akti kao u prethodnom grafikonu, po pismu kojim je tekst napisan (grafikon 3). Boja i broj su udio akata ćirilicom; desno su opštine po tom udjelu. Zbirno je ćirilicom ${pct(sum(keys, k => M[k].cyr), sum(keys, k => M[k].cyr + M[k].lat))} opštinskih akata.`,
      `The same acts as in the previous chart, by the script their text is in (chart 3). The colour and number are the share of acts in Cyrillic; on the right, the municipalities by that share. Overall, ${pct(sum(keys, k => M[k].cyr), sum(keys, k => M[k].cyr + M[k].lat))} of municipal acts are in Cyrillic.`),
    draw(el) {
      const cc = cols[6], mx = sh(hi), col = v => d3.interpolateRgb(css('--surface-2'), cc)(v ? 0.15 + 0.85 * Math.sqrt(v / mx) : 0);
      const T = tileMap(el, Object.fromEntries(keys.map(k => [k, sh(k)])), col, v => pv(100 * v, v > 0 && v < 0.01 ? 1 : 0),
        k => `<b>${MUN[k]}</b>` + trow(cc, L('Ćirilicom', 'In Cyrillic'), `${fmt(M[k].cyr)} · ${pct(M[k].cyr, M[k].cyr + M[k].lat)}`) + trow(null, L('Latinicom', 'In Latin'), fmt(M[k].lat)));
      const rows = srt.map(k => ({ k, c: M[k].cyr, l: M[k].lat }));
      const w = W(T.right), lw = textW(T.right, keys.map(k => MUN[k])) + 12, rowH = 19, svg = svgIn(T.right, w, rows.length * rowH + 4), g = svg.append('g').attr('transform', `translate(${lw},2)`);
      const iw = w - lw - 44, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
      rows.forEach((r, i) => { const cy = i * rowH, v = r.c / (r.c + r.l);
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 13).attr('text-anchor', 'end').text(MUN[r.k]);
        g.append('rect').attr('x', 0).attr('y', cy + 4).attr('width', iw).attr('height', 11).attr('rx', 5.5).attr('fill', css('--surface-2'));
        if (r.c) g.append('path').attr('d', barPath(0, cy + 4, Math.max(3, x(v)), 11, 5)).attr('fill', cc);
        g.append('text').attr('class', 'lbl').attr('x', iw + 6).attr('y', cy + 13).text(pv(100 * v, v > 0 && v < 0.01 ? 1 : 0));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', rowH).datum(r.k),
          k => `<b>${MUN[k]}</b>` + trow(cc, L('Ćirilicom', 'In Cyrillic'), fmt(M[k].cyr)) + trow(null, L('Latinicom', 'In Latin'), fmt(M[k].lat))); });
      note(el, ['<vrsta>/<godina>/<PIS id>/0-uvod.md', 'tekst.md'], fnw(sum(keys, k => M[k].cyr + M[k].lat), 'act'),
        L('pismo je ono kojim je napisana većina slova početka teksta, kako ga daje tekstualni sloj zvaničnog PDF-a; ništa nije transliterisano.', 'the script is the one most letters of the start of the text are in, as the official PDF\'s text layer gives it; nothing is transliterated.'));
      table(el, [L('Opština', 'Municipality'), L('Ćirilicom', 'Cyrillic'), L('Latinicom', 'Latin'), t('share')], srt.map(k => [MUN[k], M[k].cyr, M[k].lat, pct(M[k].cyr, M[k].cyr + M[k].lat)]));
    }
  };
});

const TOPIC = { appoint: ['Imenovanja i razrješenja', 'Appointments and dismissals'], consent: ['Saglasnosti (na statute, programe, cijene…)', 'Consents (to statutes, programmes, prices…)'],
  plan: ['Prostorno i urbanističko planiranje', 'Spatial and urban planning'], budget: ['Budžet, zaduženja i finansije', 'Budget, borrowing and finance'], fees: ['Takse, naknade, porezi i cijene', 'Local taxes, fees and prices'],
  services: ['Komunalne djelatnosti i saobraćaj', 'Municipal services and transport'], property: ['Imovina, zemljište i koncesije', 'Property, land and concessions'],
  progr: ['Programi, strategije i izvještaji', 'Programmes, strategies and reports'], social: ['Socijalna zaštita, obrazovanje, kultura, sport', 'Social protection, education, culture, sport'],
  org: ['Organizacija, statuti i radna tijela', 'Organisation, statutes and working bodies'], names: ['Nazivi, priznanja i saradnja', 'Names, awards and cooperation'], other: ['Ostalo', 'Other'] };
chart('c19', el => {
  const c = D.c19, keys = Object.keys(c.n).filter(k => k !== 'other').sort((a, b) => c.n[b] - c.n[a]).concat(['other']), N = sum(Object.values(c.n)), cols = S8();
  const YRS = d3.range(2007, YEAR_LAST + 1), a = c.n.appoint || 0;
  return {
    title: L(`O čemu odlučuju opštine: ${pct(a, N)} važećih opštinskih akata su imenovanja i razrješenja`, `What municipalities decide: ${pct(a, N)} of municipal acts in force are appointments and dismissals`),
    dek: L(`${fmt(N)} važećih akata opština po temi, iz riječi u naslovu, i po godini objavljivanja. Osim imenovanja, najčešći su prostorno planiranje (${pct(c.n.plan || 0, N)}) i saglasnosti koje skupština daje javnim preduzećima i ustanovama (${pct(c.n.consent || 0, N)}).`,
      `${fmt(N)} municipal acts in force by topic, read from words in the title, and by year of publication. Besides appointments, the most frequent are spatial planning (${pct(c.n.plan || 0, N)}) and the consents a municipal assembly gives to public companies and institutions (${pct(c.n.consent || 0, N)}).`),
    draw(el) {
      const w = W(el), nwd = narrow(w), labs = keys.map(k => L(...TOPIC[k])), lw = nwd ? 0 : Math.min(320, textW(el, labs) + 14), rowH = nwd ? 30 : 24, cw = nwd ? 0 : 26;
      const m = { t: 22, r: 6, b: 4, l: lw }, barW = nwd ? w - 50 : Math.max(120, w - lw - cw * YRS.length - 70);
      const h = m.t + m.b + keys.length * rowH, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const labW = textW(el, keys.map(k => `${fmt(c.n[k])} · ${pct(c.n[k], N)}`), 'lbl') + 10;
      const x = d3.scaleLinear().domain([0, d3.max(keys, k => c.n[k])]).range([0, barW - labW]), hx = barW + 14;
      const mx = d3.max(keys, k => d3.max(Object.values(c.years[k] || {}))), col = d3.scaleSequentialSqrt(seqRamp()).domain([0, mx]);
      if (!nwd) YRS.forEach((yy, j) => { if (yy % 2 === 1 || yy === YEAR_LAST) g.append('text').attr('class', 'lbl').attr('x', hx + j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(`’${String(yy).slice(2)}`); });
      keys.forEach((k, i) => {
        const cy = i * rowH + (nwd ? 12 : 0), by = c.years[k] || {};
        if (nwd) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy - 2).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(labs[i]);
        g.append('path').attr('d', barPath(0, cy + (nwd ? 3 : 5), x(c.n[k]), 13)).attr('fill', k === 'other' ? css('--muted-mark') : cols[1]);
        g.append('text').attr('class', 'lbl').attr('x', x(c.n[k]) + 6).attr('y', cy + (nwd ? 13 : 15)).text(`${fmt(c.n[k])} · ${pct(c.n[k], N)}`);
        if (!nwd) YRS.forEach((yy, j) => { const v = by[yy] || 0;
          bindTip(g.append('rect').attr('x', hx + j * cw + 1).attr('y', cy + 2).attr('width', cw - 2).attr('height', rowH - 4).attr('rx', 3).attr('fill', v ? col(v) : css('--surface-2')).datum([k, yy, v]),
            d => `<b>${L(...TOPIC[d[0]])} · ${d[1]}</b>` + trow(null, L('Akata', 'Acts'), fmt(d[2]))); });
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', nwd ? w : lw + barW).attr('y', cy - (nwd ? 12 : 0)).attr('height', rowH).datum(k),
          kk => `<b>${L(...TOPIC[kk])}</b>` + trow(null, t('total'), `${fmt(c.n[kk])} · ${pct(c.n[kk], N)}`) + trow(null, L('Najviše', 'Peak'), (() => { const e = Object.entries(c.years[kk] || {}).sort((a2, b2) => b2[1] - a2[1])[0]; return e ? `${e[0]} (${fmt(e[1])})` : '–'; })()));
      });
      note(el, ['data/acts.json (title)', '<vrsta>/<godina>/<PIS id>/0-uvod.md (donosilac)'], fnw(N, 'act'),
        L('tema se čita iz riječi u naslovu, pravilima u src/prep.py, ovim redom: prvo imenovanja, pa saglasnosti, budžet, planiranje, takse, komunalne djelatnosti, imovina, programi, socijalna pitanja, organizacija i nazivi; izmjena ili ukidanje odluke dobija temu odluke koju mijenja. Što nijedno pravilo ne prepozna je „Ostalo“. Godine prije 2007. su izostavljene u ćelijama (malo akata); ' + YEAR_LAST + '. je nepotpuna.',
          'the topic is read from words in the title by the rules in src/prep.py, in this order: appointments first, then consents, budget, planning, fees, municipal services, property, programmes, social matters, organisation and names; an act amending or repealing a decision takes the topic of the decision it changes. Whatever no rule recognises is "Other". Years before 2007 are left out of the cells (few acts); ' + YEAR_LAST + ' is partial.'));
      table(el, [L('Tema', 'Topic'), t('total'), ...YRS.map(String)], keys.map(k => [L(...TOPIC[k]), c.n[k], ...YRS.map(yy => (c.years[k] || {})[yy] || 0)]));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'p2', 'c05', 'c06', 'c07', 'c08', 'p3', 'c09', 'c10', 'c15', 'c11', 'c12', 'p4', 'c13', 'c14', 'c16', 'c20', 'p5', 'c17', 'c18', 'c19'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html(''), hr = P.held_reasons;
  const rows = [
    [L('Registar važećih akata', 'Register of acts in force'), 'data/acts.json', fmt(P.acts),
      L(`akti koje PIS vodi kao važeće, objavljeni ${P.first_pub.slice(0, 4)}–${P.built.slice(0, 4)}, od zakona do opštinskih odluka, svaki onakav kakav je objavljen`, `acts the PIS marks in force, published ${P.first_pub.slice(0, 4)}–${P.built.slice(0, 4)}, from laws to municipal decisions, each as published`),
      L(`Službeni list ne objavljuje prečišćene tekstove: ${fmt(P.status['amended, not consolidated'])} akata ima kasnije izmjene koje nijesu primijenjene na njihov tekst`, `the Službeni list publishes no consolidated texts: ${fmt(P.status['amended, not consolidated'])} acts have later amendments not applied to their text`)],
    [L('Datumi', 'Dates'), 'data/laws.csv', fmt(P.acts), L('dani donošenja, objavljivanja i stupanja na snagu, broj Službenog lista', 'days of enactment, publication and entry into force; the Gazette issue'),
      L('za zakone je dan donošenja jednak danu objavljivanja; dan glasanja u Skupštini je u preambuli', 'for laws the day of enactment equals the day of publication; the day of the vote is in the preamble')],
    [L('Tekstovi akata', 'Texts of the acts'), '<vrsta>/<godina>/<PIS id>/*.md', `${fmt(P.opening_texts)} · ${fmt(P.full_texts)}`,
      L('početak teksta svakog akta (preambula ili prvi član); cijeli tekst svih zakona, uredbi Vlade i pravilnika, svih akata objavljenih do 2008. i odluka o usklađivanju penzija', 'the start of every act\'s text (the preamble or first article); the whole text of all laws, Government decrees and rulebooks, of all acts published up to 2008 and of the pension adjustment decisions'),
      L('tekst je tekstualni sloj zvaničnog PDF-a, bez transliteracije; fusnote i potpisi nijesu u tekstu', 'the text is the official PDF\'s text layer, not transliterated; footnotes and signatures are not in the text')],
    [L('Ustav', 'The Constitution'), 'ustav/ · git log -- ustav', `${fmt(D.c13.prov.length)} · ${fmt(D.c13.amend.length)}`, L('odredbe Ustava iz 2007. (158 članova, preambula i 22 naslova dijelova i glava) i amandmani I–XXI kao commiti', 'the provisions of the 2007 Constitution (158 articles, the preamble and 22 headings of parts and chapters), and amendments I–XXI as commits'),
      L('amandmani su primijenjeni kodom na odredbu koju svaki navodi', 'the amendments are applied by code to the provision each names')],
    [L('Ukazi o ambasadorima', 'Decrees on ambassadors'), 'ukaz/', fmt(P.ukaz), `${D.c14.decrees[0][0].slice(0, 4)}–${P.built.slice(0, 4)}`,
      L(`samo metapodaci (naslov, broj lista, datum) i zvanični link; još ${fmt(D.c14.held_only)} u data/held.json bez datuma`, `metadata only (title, issue, date) and the official link; ${fmt(D.c14.held_only)} more in data/held.json with no date`)],
    [L('Važeći akti van repozitorijuma', 'Acts in force held back'), 'data/held.json', fmt(P.held),
      L(`dan stupanja na snagu se ne može pročitati (${fmt(hr.in_force_unknown)}), izmijenjen akt čiji tekst još nije pročitan (${fmt((hr.amended_on_pis_text_not_fetched || 0) + (hr.named_as_amended || 0))}), vrsta još nije obrađena (${fmt(hr.kind_not_built)}), tekst se ne čita čisto i drugo`,
        `in-force day unreadable (${fmt(hr.in_force_unknown)}), amended act whose text is not read yet (${fmt((hr.amended_on_pis_text_not_fetched || 0) + (hr.named_as_amended || 0))}), kind not built yet (${fmt(hr.kind_not_built)}), text that does not read cleanly and other`),
      L(`grafikoni ih ne broje, osim u oblačićima grafikona 8 i u napomeni grafikona 15; ${fmt(P.held_overlap)} od njih je u registru kao objavljeni tekst`, `the charts do not count them, except in the tooltips of chart 8 and the note of chart 15; ${fmt(P.held_overlap)} of them are in the register as published text`)],
    [L('Istorija gita', 'Git history'), 'git log', fmt(P.commits), L('jedan commit po verziji akta, s datumom dana kada je stupila na snagu (In-force:)', 'one commit per version of an act, dated the day it took effect (In-force:)'),
      L('ispravke se dodaju kasnije, s datumom koji ispravljaju', 'corrections are appended later, with the date they correct')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG === 'cnr' ? 'cnr' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[PF.acts, ['važeći akt u registru', 'važeća akta u registru', 'važećih akata u registru'], 'acts in force in the register'],
    [PF.laws, ['zakon', 'zakona', 'zakona'], 'laws'], [PF.municipal, ['opštinski akt', 'opštinska akta', 'opštinskih akata'], 'municipal acts'],
    [PF.amendments, ['amandman na Ustav', 'amandmana na Ustav', 'amandmana na Ustav'], 'amendments to the Constitution'],
    [PF.commits, ['commit u istoriji gita', 'commita u istoriji gita', 'commitova u istoriji gita'], 'commits in the git history'],
    [PF.held, ['važeći akt još van repozitorijuma', 'važeća akta još van repozitorijuma', 'važećih akata još van repozitorijuma'], 'acts in force not yet in the repository']];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${fmt(d[0])}</b><span>${esc(CNR() ? plf(d[0], ...d[1]) : d[2])}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.cnr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dcnr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.cnr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('me-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('me-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
